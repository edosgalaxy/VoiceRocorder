name: Build VoiceRocorder (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\VoiceRocorder.sln

      - name: Publish self-contained EXE
        run: dotnet publish .\VoiceRocorder\VoiceRocorder.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRocorder-Windows-x64
          path: VoiceRocorder\bin\Release\net8.0-windows\win-x64\publish\
          if-no-files-found: error
          retention-days: 14
